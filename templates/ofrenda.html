<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ofrenda</title>
<style>
:root { color-scheme: dark; }
body { margin: 0; min-height: 100vh; color: #f6e7c1;
  background: radial-gradient(circle at 50% 0%, #3a2410, #14080c 55%);
  font-family: Palatino, Georgia, serif; }
.picado { height: 28px; background:
  radial-gradient(circle at 14px 0, transparent 12px, #e8872a 13px) 0 0 / 28px 28px repeat-x; }
.picado.bottom { transform: scaleY(-1); }
main { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; text-align: center; }
h1 { font-weight: normal; letter-spacing: .14em; text-transform: uppercase; color: #ffb703; }
.altar { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; margin-top: 28px; }
.candle { width: 180px; }
.flame { width: 16px; height: 28px; margin: 0 auto; border-radius: 50% 50% 45% 45%;
  background: radial-gradient(circle at 50% 30%, #fff6d0, #ffb703 45%, #e85d04 75%);
  filter: drop-shadow(0 0 10px #ffb703); animation: glow 1.3s ease-in-out infinite; }
.wax { width: 28px; height: 64px; margin: -4px auto 12px; border-radius: 4px 4px 8px 8px;
  background: linear-gradient(#f3d5a0, #c4843a); }
h2 { font-size: 1.05rem; margin: 0; word-break: break-word; }
time, .empty { display: block; color: #e8a87c; font-size: .9rem; }
@keyframes glow { 50% { transform: scale(1.12) translateY(-2px); opacity: .8; } }
</style></head><body>
<div class="picado"></div>
<main><h1>Ofrenda</h1>
<p>For the files and branches that left the machine.</p>
<div class="altar"><!--CANDLES--></div>
</main>
<div class="picado bottom"></div>
</body></html>
